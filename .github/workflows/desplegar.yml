name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lo minimo que pide deploy-pages: leer el repo, escribir en Pages y firmar
# el despliegue con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Si llegan dos push seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Compila y, en el mismo paso, poda las capas internas del dist.
      # Sin VITE_CAPAS_INTERNAS, el build sale publico por defecto.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
