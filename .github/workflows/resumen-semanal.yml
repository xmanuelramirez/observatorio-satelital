name: Resumen semanal

# Cada lunes calcula la obra nueva en la zona urbana con el mismo codigo de la
# app y sube el resultado a `semanal/`. El vigia lee de ahi el JSON y lo manda
# por Telegram. Este flujo no toca Cloudflare ni Telegram: su unico permiso es
# escribir en este repositorio, con el token que GitHub da a cada corrida.

on:
  schedule:
    # Lunes 06:00 UTC, medianoche en Leon.
    #
    # Siete horas de margen antes de que el vigia lo busque a las 07:07, y no
    # media: los horarios de GitHub Actions se encolan y llegan tarde. El
    # lunes 21 de septiembre de 2026 una cita de las 12:30 UTC arranco a las
    # 18:17, y el vigia alcanzo a avisar que el calculo no habia corrido.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumen-semanal
  cancel-in-progress: false

jobs:
  resumen:
    # Se queda en ubuntu-latest a proposito, aunque el 19/10/2026 pase a
    # Ubuntu 26. Lo que corre aqui es JavaScript puro sobre la version de Node
    # que fija setup-node, no binarios del sistema, asi que el cambio de
    # imagen casi no toca este flujo. Si aun asi se rompiera despues de esa
    # fecha, este es el primer sitio donde mirar, y la salida es fijar
    # `ubuntu-24.04`. Avisar a AGENTES si se cambia: el vigia lee lo que este
    # flujo publica.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Calcular obra nueva
        run: npm run semanal

      # Si la escena mas reciente es la misma de la semana pasada, el JSON
      # cambia solo en la fecha de generacion y se sube igual: el vigia
      # distingue por fechaActual si hay algo nuevo que contar.
      - name: Subir resultado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semanal
          git commit -m "Resumen semanal de obra nueva $(date -u +%F)" || exit 0
          git push
